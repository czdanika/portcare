# Portainer Update Service – helyi build (Portainer "Repository" stack vagy docker compose).
# Előre megépített image-hez lásd a README-t (ghcr.io/...).
services:
  update-service:
    build: .
    container_name: portainer-update-service
    restart: unless-stopped
    ports:
      - "8742:8090"
    environment:
      TZ: "Europe/Budapest"
      # PUS_AUTH_TOKEN: "egy-hosszu-jelszo"   # opcionális fix admin jelszó
    volumes:
      - pus-data:/app/data
      - pus-config:/app/config
      # Csak a "Portainer önfrissítés" funkcióhoz kell (biztonsági okból alapból kikapcsolva):
      # - /var/run/docker.sock:/var/run/docker.sock
      # - /path/to/portainer/compose:/host-portainer:ro

volumes:
  pus-data:
  pus-config:
